<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Project Cost Manager</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- CSS stampa: nasconde colonne interne e sidebar durante window.print() -->
  <style>
    @media print {
      /* Nasconde tutta l'interfaccia tranne il preventivo */
      #sidebar, #save-bar, .proj-bar, .btn-add,
      [data-role="cu"],          /* input costo interno */
      th:nth-child(5),           /* intestazione colonna Costo Int. */
      td:nth-child(5),           /* celle colonna Costo Int. */
      #prev-recap,               /* riepilogo margine interno */
      button { display: none !important; }

      #main { margin-left: 0 !important; padding: 10px !important; }
      body   { background: #fff !important; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       SIDEBAR
       ============================================================ -->
  <div id="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;background:rgba(255,255,255,.12);border-radius:8px;
          display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21C7 21 3.5 17 3.5 12.5 3.5 8 6.5 4 12 2c5.5 2 8.5 6 8.5 10.5C20.5 17 17 21 12 21z" fill="#52B788"/>
            <path d="M12 20V7" stroke="#F9A825" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 10 C10 9.5 8 10 7 11.5" stroke="#F9A825" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
            <path d="M12 13.5 C10 13 8 13.5 7 15" stroke="#F9A825" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
            <path d="M12 10 C14 9.5 16 10 17 11.5" stroke="#F9A825" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
            <path d="M12 13.5 C14 13 16 13.5 17 15" stroke="#F9A825" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
          </svg>
        </div>
        <div>
          <h2>Project Cost Manager</h2>
          <small data-i18n="app.subtitle">Offline project control</small>
        </div>
      </div>
    </div>

    <nav style="padding:10px 0;">
      <a onclick="App.go('dashboard')"        id="nav-dashboard"        class="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span data-i18n="nav.dashboard">Dashboard</span></a>
      <a onclick="App.go('anagrafica')"       id="nav-anagrafica">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span data-i18n="nav.projects">Projects</span></a>
      <a onclick="App.go('budget')"           id="nav-budget">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span data-i18n="nav.budget">Budget</span></a>
      <a onclick="App.go('consuntivo')"       id="nav-consuntivo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span data-i18n="nav.actuals">Actuals</span></a>
      <a onclick="App.go('varianze')"         id="nav-varianze">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span data-i18n="nav.variance">Variance</span></a>
      <a onclick="App.go('costigenerali')"    id="nav-costigenerali">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        <span data-i18n="nav.overheads">Overheads</span></a>
      <a onclick="App.go('analytics')"        id="nav-analytics">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span data-i18n="nav.analytics">Analytics</span></a>

      <!-- Separatore sezione Preventivi -->
      <div style="margin:10px 18px;border-top:1px solid rgba(255,255,255,.10);"></div>

      <!-- Voce: Preventivi Cliente -->
      <a onclick="App.go('preventivi')"       id="nav-preventivi">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
          <line x1="9" y1="17" x2="11" y2="17"/>
          <line x1="13" y1="17" x2="15" y2="17"/>
        </svg>
        <span data-i18n="nav.quotes">Quotes</span></a>

      <!-- Voce: Impostazioni Preventivi (ex Impostazioni Prezzi) -->
      <a onclick="App.go('politicaprezzi')"   id="nav-politicaprezzi">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                   a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                   A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
                   l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                   A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
                   l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                   a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
                   l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                   a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span data-i18n="nav.pricing">Pricing Settings</span></a>

      <!-- Separatore utilità -->
      <div style="margin:10px 18px;border-top:1px solid rgba(255,255,255,.10);"></div>

      <a onclick="exportExcel()"         id="nav-export">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span data-i18n="nav.exportExcel">Export Excel</span></a>
      <a onclick="importExcelTrigger()" id="nav-import">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span data-i18n="nav.importExcel">Import Excel</span></a>
      <a onclick="App.go('backup')" id="nav-backup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span data-i18n="nav.backup">Backup JSON</span></a>
      <a onclick="App.go('settings')" id="nav-settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span data-i18n="nav.settings">Settings</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="theme-toggle-row">
        <span id="theme-toggle-label" data-i18n="theme.label">Dark mode</span>
        <button id="theme-toggle" class="theme-toggle" type="button" role="switch"
          aria-checked="false" aria-label="Light mode" onclick="AppSettings.toggleTheme()">
          <span class="theme-toggle-knob"></span>
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div id="user-avatar" style="width:34px;height:34px;border-radius:50%;
          background:var(--amber);color:#1B4332;display:flex;align-items:center;
          justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">?</div>
        <div style="overflow:hidden;">
          <div style="font-size:11px;color:#95D5B2;margin-bottom:1px;" data-i18n="session.label">Mode</div>
          <div style="font-size:12px;color:#fff;font-weight:600;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
            <span id="user-email-lbl"></span>
          </div>
        </div>
      </div>
      <button onclick="doLogout()" style="width:100%;padding:8px;
        background:rgba(255,255,255,.10);color:#fff;
        border:1px solid rgba(255,255,255,.20);border-radius:var(--radius-sm);
        font-size:12px;cursor:pointer;font-weight:600;font-family:var(--font);
        display:flex;align-items:center;justify-content:center;gap:6px;transition:background .18s;"
        onmouseover="this.style.background='rgba(255,255,255,.20)'"
        onmouseout="this.style.background='rgba(255,255,255,.10)'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
      <div style="font-size:9px;color:#52B788;margin-top:8px;text-align:center;">
        v1 &middot; Offline
      </div>
    </div>
  </div>

  <!-- ============================================================
       SAVE BAR
       ============================================================ -->
  <div id="save-bar">
    <div class="dot"></div>
    <span id="save-label">Saved</span>
  </div>

  <!-- ============================================================
       AREA PRINCIPALE — pagine renderizzate via JS
       ============================================================ -->
  <div id="main">
    <div id="page-dashboard"      class="page active"></div>
    <div id="page-anagrafica"     class="page"></div>
    <div id="page-budget"         class="page"></div>
    <div id="page-consuntivo"     class="page"></div>
    <div id="page-varianze"       class="page"></div>
    <div id="page-costigenerali"  class="page"></div>
    <div id="page-analytics"      class="page"></div>
    <!-- Modulo Preventivi -->
    <div id="page-preventivi"     class="page"></div>
    <div id="page-politicaprezzi" class="page"></div>
    <div id="page-backup"         class="page"></div>
    <div id="page-settings"       class="page"></div>
  </div>

  <!-- Input nascosto per import Excel -->
  <input type="file" id="import-excel-input" accept=".xlsx,.xls"
    style="display:none" onchange="importExcel(event)">
  <input type="file" id="restore-backup-input" accept=".json"
    style="display:none" onchange="restoreBackupJson(event)">

  <!-- ============================================================
       JAVASCRIPT — ordine di caricamento critico
       ============================================================ -->
  <script src="js/config.js"></script>
  <script src="js/database.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/autosave.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/anagrafica.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/varianze.js"></script>
  <script src="js/costigenerali.js"></script>
  <script src="vendor/sheetjs/xlsx.full.min.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/analytics.js"></script>
  <!-- Modulo Preventivi (caricato dopo budget.js da cui dipende per i pattern) -->
  <script src="js/politicaprezzi.js"></script>
  <script src="js/preventivi.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
